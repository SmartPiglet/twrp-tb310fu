name: Build TWRP recovery (TB310FU)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git python3 repo libxml2-utils \
            zip unzip cpio rsync bc liblz4-tool zstd

      - name: Configure git
        run: |
          git config --global user.name "SmartPiglet CI"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Init TWRP 12.1 minimal manifest
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

      - name: Repo sync
        run: |
          cd $HOME/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Add device tree
        run: |
          cd $HOME/twrp
          mkdir -p device/lenovo
          rsync -a --exclude '.git' "$GITHUB_WORKSPACE/device/lenovo/m9" device/lenovo/
          find device/lenovo/m9 -maxdepth 2 | head -40

      - name: Build recovery image
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_m9-eng
          # This device has NO recovery partition (BOARD_USES_RECOVERY_AS_BOOT := true).
          # build/make/core/board_config.mk therefore sets BUILDING_RECOVERY_IMAGE=true and
          # leaves INSTALLED_RECOVERYIMAGE_TARGET empty, so the "recoveryimage" goal is a
          # no-op. core/Makefile attaches the recovery recipe to INSTALLED_BOOTIMAGE_TARGET
          # instead, so the correct goal is the boot image.
          mka bootimage -j$(nproc --all)
          ls -l out/target/product/m9/
          test -s out/target/product/m9/boot.img
          cp -v out/target/product/m9/boot.img out/target/product/m9/recovery.img

      - name: Verify image
        if: always()
        run: |
          cd $HOME/twrp
          IMG=out/target/product/m9/recovery.img
          if [ ! -f "$IMG" ]; then echo "NO IMAGE PRODUCED"; exit 1; fi
          python3 "$GITHUB_WORKSPACE/tools/verify_recovery.py" "$IMG"
          sha256sum "$IMG" | tee "$GITHUB_WORKSPACE/recovery.img.sha256"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-recovery-tb310fu
          path: |
            /home/runner/twrp/out/target/product/m9/recovery.img
            /home/runner/twrp/out/target/product/m9/boot.img
          if-no-files-found: warn
          retention-days: 90

      - name: Upload verbose build log on failure
        if: failure()
        run: |
          cd $HOME/twrp
          ls -l out/verbose.log.gz 2>/dev/null || true
          zcat out/verbose.log.gz 2>/dev/null | grep -iE "error|failed|no rule" | tail -120 || true
